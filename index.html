<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End Ästhetik</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Hero Sektion mit sanftem Zoom-Effekt beim Laden */
        .hero {
            height: 100vh;
            width: 100vw;
            background: url('kanye.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
            animation: zoomIn 15s infinite alternate ease-in-out;
        }

        /* Glassmorphism mit subtiler Schatten-Animation */
        .content {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px;
            border-left: 6px solid #ffffff;
            max-width: 450px;
            animation: slideIn 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: -3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            line-height: 1;
        }

        p {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.7;
            opacity: 0.85;
        }

        /* Animationen */
        @keyframes zoomIn {
            from { background-size: 100% 100%; }
            to { background-size: 110% 110%; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="content">
        <h1>Zeitloser Stil</h1>
        <p>Reduziert auf das Wesentliche. Die Verschmelzung von kraftvoller Präsenz und moderner Ästhetik.</p>
    </div>
</div>

</body>
</html>
