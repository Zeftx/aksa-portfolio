<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stil & Ästhetik</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* Das Bild als Hintergrund */
        .hero {
            height: 100vh;
            background: url('kanye.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 10%;
        }

        /* Glassmorphism Effekt für die Box */
        .content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-left: 4px solid #fff;
            max-width: 400px;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        p {
            font-weight: 300;
            line-height: 1.6;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="content">
        <h1>Zeitloser Stil</h1>
        <p>Ein Blick auf die Ästhetik der modernen Mode. Reduziert, kraftvoll und präzise.</p>
    </div>
</div>

</body>
</html>
